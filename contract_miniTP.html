<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - IT 130</title>
</head>
<body>
    <!-- En-tête avec un lien pour revenir au blog -->
    <header>
        <h1>Me Contacter</h1>
        <nav>
            <a href="blog.html">← Retour au blog</a>
        </nav>
    </header>

    <!-- Contenu principal -->
    <main>
        <section>
            <h2>Formulaire de contact</h2>
            <p>Remplissez ce formulaire pour me laisser un message.</p>
            
            <!-- Le formulaire -->
            <form action="#" method="post">
                <div>
                    <label for="nom">Votre Nom :</label><br>
                    <input type="text" id="nom" name="nom" required>
                </div>
                <br>
                <div>
                    <label for="email">Votre Email :</label><br>
                    <input type="email" id="email" name="email" required>
                </div>
                <br>
                <div>
                    <label for="message">Votre Message :</label><br>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <br>
                <button type="submit">Envoyer le message</button>
            </form>
        </section>
    </main>

    <!-- Pied de page -->
    <footer>
        <p>© 2026 Mon Blog - Créé par Clémence DETCHINLI</p>
    </footer>
</body>
</html>
